<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%23123F8C%22/%3E%3Cpath d=%22M6 20v-4l3-6h13l4 6h1v4z%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2211%22 cy=%2221%22 r=%222.5%22 fill=%22%23123F8C%22 stroke=%22%23fff%22 stroke-width=%221.5%22/%3E%3Ccircle cx=%2222%22 cy=%2221%22 r=%222.5%22 fill=%22%23123F8C%22 stroke=%22%23fff%22 stroke-width=%221.5%22/%3E%3C/svg%3E">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Dossier de la voiture – Rétroviz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Mêmes variables que l'application (voir DESIGN.md). */
:root{
  --bg:#F6F9FD;--surface:#FFFFFF;--soft:#E8F0FB;--line:#D8E3F0;--field-line:#7A8CA6;--ink:#0E1F3B;--muted:#4E5F78;--primary:#123F8C;--on-primary:#FFFFFF;
  --green:#1E8449;--green-ink:#176A3A;--amber:#C77700;--amber-ink:#8A4F00;--red:#C8372D;--red-ink:#A92C23;--grey:#7A8CA6;
  --shadow:0 1px 2px rgb(14 31 59 / .06), 0 4px 16px rgb(14 31 59 / .06);
  --font:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --fs-xs:13px;--fs-sm:15px;--fs-md:17px;--fs-lg:20px;--fs-xl:24px;--fs-2xl:32px;--lh:1.55;--lh-tight:1.2;
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-pill:999px;
  color-scheme:light;box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1426;--surface:#101D33;--soft:#172A4A;--line:#24375A;--field-line:#62789E;--ink:#E6EEF9;--muted:#A3B4CF;--primary:#8DB8F7;--on-primary:#0A1426;
  --green:#4CC27C;--green-ink:#6ED597;--amber:#F0B03E;--amber-ink:#F4C468;--red:#F06A5E;--red-ink:#F48E84;--grey:#7D90B0;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1426;--surface:#101D33;--soft:#172A4A;--line:#24375A;--field-line:#62789E;--ink:#E6EEF9;--muted:#A3B4CF;--primary:#8DB8F7;--on-primary:#0A1426;
  --green:#4CC27C;--green-ink:#6ED597;--amber:#F0B03E;--amber-ink:#F4C468;--red:#F06A5E;--red-ink:#F48E84;--grey:#7D90B0;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs-md);line-height:var(--lh);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
main{max-width:880px;margin:0 auto;padding:var(--sp-5) 16px var(--sp-7)}
a{color:var(--primary);text-underline-offset:2px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:var(--fs-xs);color:var(--muted);margin:var(--sp-1) 0 0}
.bandeau{display:flex;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap;align-items:baseline;margin:0 0 var(--sp-5);padding-bottom:var(--sp-3);border-bottom:1px solid var(--line)}
.marque{font-weight:var(--fw-bold);color:var(--primary);font-size:var(--fs-lg);text-decoration:none}
.lecture{color:var(--muted);font-size:var(--fs-sm)}
.erreur{background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-5);box-shadow:var(--shadow)}
/* Composants repris de l'application */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:var(--sp-3);margin:0 0 var(--sp-5)}
.kpi{background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-4);box-shadow:var(--shadow)}
.kpi strong{display:block;font-size:var(--fs-2xl);line-height:1;color:var(--primary);font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:var(--fs-sm)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px var(--sp-3);border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:var(--fw-bold);background:var(--soft);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,var(--grey))}
.pill[data-s="retard"]{--c:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red-ink)}
.pill[data-s="bientot"]{--c:var(--amber);background:color-mix(in srgb,var(--amber) 14%,var(--surface));color:var(--amber-ink)}
.pill[data-s="plus_tard"]{--c:var(--green)}
.pill[data-s="verifier"]{--c:var(--primary)}
.bsuivi{background:var(--surface);border-radius:var(--r-lg);padding:var(--sp-4) var(--sp-5);box-shadow:var(--shadow);margin:0 0 var(--sp-5)}
.bsuivi.ok{background:var(--soft)}
.bsuivi h3{margin:0 0 var(--sp-1);font-size:var(--fs-lg);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.bsuivi .etoile{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:18px;flex:none}
.bsuivi .etoile.vide{background:var(--soft);color:var(--primary)}
.crit{list-style:none;margin:var(--sp-3) 0 0;padding:0;display:grid;gap:var(--sp-2)}
.crit li{display:grid;grid-template-columns:24px 1fr;gap:var(--sp-2);align-items:start}
.crit .coche{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:var(--fw-bold);background:var(--soft);color:var(--muted)}
.crit .coche.ok{background:var(--primary);color:var(--on-primary)}
.crit strong{display:block}
.crit .d{color:var(--muted);font-size:var(--fs-sm)}
.jalons{list-style:none;margin:0 0 var(--sp-5);padding:0;display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.jalons li{display:inline-flex;align-items:center;gap:var(--sp-2);background:var(--soft);color:var(--primary);border-radius:var(--r-pill);padding:var(--sp-1) var(--sp-3);font-weight:var(--fw-semibold);font-size:var(--fs-sm)}
.jalons small{color:var(--muted);font-weight:var(--fw-regular)}
.frise{list-style:none;margin:0;padding:0 0 0 var(--sp-5);border-left:2px solid var(--line)}
.frise .annee{margin:var(--sp-5) 0 var(--sp-2) calc(-1 * var(--sp-5) - 1px);font-weight:var(--fw-bold);color:var(--primary);background:var(--bg);padding:2px 0}
.frise .annee:first-child{margin-top:0}
.ev{position:relative;padding:var(--sp-2) 0 var(--sp-3)}
.ev::before{content:"";position:absolute;left:calc(-1 * var(--sp-5) - 7px);top:15px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--field-line)}
.ev[data-t="entretien"]::before{border-color:var(--primary)}
.ev[data-t="jalon"]::before{background:var(--primary);border-color:var(--primary)}
.ev[data-t="achat"]::before,.ev[data-t="ajout"]::before{background:var(--soft);border-color:var(--primary)}
.ev .quand{color:var(--muted);font-size:var(--fs-xs)}
.ev .quoi{font-weight:var(--fw-semibold)}
.ev[data-t="jalon"] .quoi{color:var(--primary)}
.ev .det{color:var(--muted);font-size:var(--fs-sm);display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);align-items:center}
</style>
<link rel="stylesheet" href="/dossier.css">
</head>
<body>
<main>
  <div class="bandeau"><a class="marque" href="/">Rétroviz</a><span class="lecture">Dossier partagé en lecture seule</span></div>
  <div id="dossier" aria-live="polite"><p class="hint">Chargement du dossier…</p></div>
</main>
<script src="/dossier-rendu.js"></script>
<script>
(async () => {
  const out = document.getElementById("dossier");
  const token = location.hash.slice(1);
  const erreur = t => { out.innerHTML = `<div class="erreur"><h1 style="margin-top:0;font-size:var(--fs-xl)">Dossier indisponible</h1><p>${t}</p></div>`; };
  if (!/^[A-Za-z0-9_-]{32}$/.test(token)) return erreur("Ce lien est incomplet. Demandez au propriétaire de la voiture de vous le renvoyer.");
  try {
    const res = await fetch(`/api/dossier/${token}`);
    const j = await res.json();
    if (!res.ok) return erreur(j.error || "Ce lien a expiré ou a été révoqué.");
    document.title = `${j.dossier.voiture.marque} ${j.dossier.voiture.modele} : dossier de la voiture – Rétroviz`;
    out.innerHTML = Dossier.html(j.dossier);
  } catch { erreur("Le serveur ne répond pas. Réessayez dans un moment."); }
})();
</script>
</body>
</html>
